schema = 1
id = "infra"
name = "Infrastructure and operations code (DevOps, SRE)"
kind = "infra"
summary = "What surrounds the application code: how each container is built, deployed, configured per environment and watched. Judged for the whole repository, tool by tool, and then joined to the C4 containers: every unit that runs should have a build, a deployment, a pipeline and signals that tell when it is unhealthy."

