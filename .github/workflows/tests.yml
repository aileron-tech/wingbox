# The test suite on Linux, macOS and Windows, with every supported Python version.
# Installs the parsers the way local runs do (AGENTS.md): every requirements file, through uv.
name: tests

# A change of documents only (Markdown, docs/, LICENSE) skips this matrix; docs.yml checks it on one cell.
on:
  push:
    branches: [main, windows-support, windows-powershell, mcpb-extension, github-action, fix-init-small-repo, windows-console-and-refresh, write-zones-and-install-list, rust-definer-edges, rust-numbers, rust-reference-definers]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]

permissions:
  contents: read

# A new push to a pull request or a feature branch replaces the run in progress; every push to main runs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "0"   # the code must not rely on UTF-8 mode
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the plugin check reads the release tags
      - name: Install uv
        run: pipx install uv
      - name: Requirements
        shell: bash
        run: cat requirements.txt requirements/*.txt | sort -u > "$RUNNER_TEMP/wingbox-requirements.txt"
      - name: Tests
        shell: bash
        run: |
          git config --global user.email "tests@example.invalid"
          git config --global user.name "tests"
          uv run --no-project --python "${{ matrix.python }}" --with-requirements "$RUNNER_TEMP/wingbox-requirements.txt" \
            python -m unittest discover -s tests
      - name: Hooks as Claude Code runs them
        # Every hook entry Wingbox offers (global install, init's assistant-setup.md, the plugin manifest) run in exec
        # form with no shell; on Windows with Git for Windows taken off PATH (tools/check_hooks.py).
        shell: pwsh
        run: |
          uv venv --python "${{ matrix.python }}" "$env:RUNNER_TEMP/hookvenv"
          $env:VIRTUAL_ENV = "$env:RUNNER_TEMP/hookvenv"
          uv pip install .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { Join-Path $env:RUNNER_TEMP "hookvenv/Scripts" } else { Join-Path $env:RUNNER_TEMP "hookvenv/bin" }
          $env:PATH = "$bin$([IO.Path]::PathSeparator)$env:PATH"
          Get-Command uvx, wingbox | Format-Table Name, CommandType, Source -AutoSize
          python tools/check_hooks.py --source "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE
      - name: wingbox update through each installer
        # The checkout installed four ways (uv pip, uv tool, pip, pipx) and updated by running its own wingbox
        # program, which on Windows is a running wingbox.exe the installer has to replace (tools/check_update.py).
        shell: bash
        run: uv run --no-project --python "${{ matrix.python }}" python tools/check_update.py

  # The one command that downloads, against the real package index, in a job of its own so that an index
  # outage is told apart from a failing test: the checkout installed without any extra, a build that skips
  # C# and Go, `wingbox add` of both into a temporary per-user folder, and the graph with them at its next
  # use (tools/check_add.py). The unit tests of the matrix cover the same path without the network.
  add:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pipx install uv
      - name: wingbox add from the package index
        shell: bash
        run: uv run --no-project --python 3.12 python tools/check_add.py
