# Times the graph build of Wingbox and Graphify on the benchmark corpus, on a
# clean hosted runner. Started by hand; the result is the artifact
# build_times.json and the table in the run summary.
name: benchmark-build-time

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Runs per tool and corpus
        default: "3"

permissions:
  contents: read

jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ROUNDS: ${{ inputs.rounds }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pipx install uv
      - name: Environments and corpus at the pinned commits
        run: RUN_ONLY=corpus benchmarks/graphify/run.sh "$RUNNER_TEMP/bench"
      - name: Time the builds
        run: python3 -I benchmarks/graphify/tools/time_builds.py "$RUNNER_TEMP/bench" "$ROUNDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: build_times
          path: ${{ runner.temp }}/bench/out/build_times.json
