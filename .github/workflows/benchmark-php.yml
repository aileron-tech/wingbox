# Builds the PHP benchmark image and runs it: the benchmark in a clean container,
# compared with the committed results. The run fails when a result differs.
name: benchmark-php

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmarks/php/**"
      - "benchmarks/impact/stats.py"
      - ".github/workflows/benchmark-php.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f benchmarks/php/Dockerfile.php -t wingbox-php-benchmark .
      - name: Run the benchmark and compare with the committed results
        run: |
          set -o pipefail
          docker run --rm wingbox-php-benchmark | tee docker_run.log
      - name: Summary
        run: |
          {
            echo '```'
            grep -E '^(wingbox |PHP |== |REPRODUCED|DIFFERENT)|questions |edges ' docker_run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: docker_run
          path: docker_run.log
