# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# The name io.github.aileron-tech/wingbox belongs to the organization, and the registry
# accepts it only from this repository's GitHub Actions identity (OIDC): no token, no secret.
# Run it after the version named in server.json is on PyPI: the registry reads the
# `mcp-name:` line in the package description there.
name: publish-mcp

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Wait until the version of server.json is on PyPI
        run: |
          set -euo pipefail
          version="$(python3 -c "import json; print(json.load(open('server.json'))['version'])")"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "https://pypi.org/pypi/wingbox/${version}/json" | grep -q "mcp-name: io.github.aileron-tech/wingbox"; then
              echo "wingbox ${version} is on PyPI with the mcp-name line"; exit 0
            fi
            sleep 20
          done
          echo "wingbox ${version} is not on PyPI with the mcp-name line" >&2; exit 1
      - name: Validate
        run: ./mcp-publisher validate
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
