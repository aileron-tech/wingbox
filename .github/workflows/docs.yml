# A change of documents only: the tests that read a document (and compare it with the code or with result
# files) on one cell instead of the nine of tests.yml.
name: docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths: ["**/*.md", "docs/**", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # the plugin tests read the release tags
      - name: Install uv
        run: pipx install uv
      - name: Documentation tests
        run: |
          set -euo pipefail
          cat requirements.txt requirements/*.txt | sort -u > "$RUNNER_TEMP/wingbox-requirements.txt"
          uv run --no-project --python 3.12 --with-requirements "$RUNNER_TEMP/wingbox-requirements.txt" \
            python -m unittest tests.test_english_only tests.test_readme_numbers tests.test_plugins tests.test_mcpb tests.test_assurance_docs \
              tests.test_output_formats_cli tests.test_json_errors tests.test_mcp_registry \
              tests.test_benchmark_report tests.test_benchmark_cpp_collisions
