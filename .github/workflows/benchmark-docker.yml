# Builds Dockerfile.benchmark and runs it: the benchmark in a clean container,
# compared with the committed results. The run fails when a result differs.
name: benchmark-docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "Dockerfile.benchmark"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Build the image
        run: docker build -f Dockerfile.benchmark -t wingbox-benchmark .
      - name: Run the benchmark and compare with the committed results
        run: docker run --rm wingbox-benchmark | tee docker_run.log
      - name: Summary
        run: |
          {
            echo '```'
            grep -E '^(wingbox |== |REPRODUCED|DIFFERENT)|dependencies in the code' docker_run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docker_run
          path: docker_run.log
