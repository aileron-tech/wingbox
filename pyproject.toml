[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wingbox"
version = "0.13.0"
description = "A map of your codebase for AI coding agents: what a change breaks, where a symbol is used, how the architecture is layered. Local, no model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aileron Technologies" }]
keywords = [
    "code-graph",
    "blast-radius",
    "impact-analysis",
    "dependency-graph",
    "code-search",
    "static-analysis",
    "tree-sitter",
    "ai-coding-agents",
    "claude-code",
    "codex",
    "offline",
    "local-first",
    "air-gapped",
    "graphify",
    "graphify-alternative",
    "knowledge-graph",
    "code-knowledge-graph",
    "codebase-map",
    "mcp",
    "mcp-server",
    "claude-code-plugin",
    "cursor",
    "monorepo",
    "architecture",
    "find-usages",
    "refactoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
# The parser of every language is installed with the package. The pins equal those of the language
# adapters (scripts/lang/<language>/__init__.py) and of requirements/<language>.txt (REQ-DEPS-012).
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-java==0.23.5",
    "tree-sitter-go==0.25.0",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-php==0.24.1",
    # No wheel of the Dart grammar exists for Windows arm64: there the package installs without it
    # and a build skips .dart files with a warning.
    'tree-sitter-dart==0.1.0; sys_platform != "win32" or platform_machine != "ARM64"',
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
# Kept so that `pip install "wingbox[csharp]"` and `"wingbox[all]"`, written for 0.12, keep working:
# each names a parser the package already depends on, with the same pin.
csharp = ["tree-sitter-c-sharp==0.23.5"]
java = ["tree-sitter-java==0.23.5"]
go = ["tree-sitter-go==0.25.0"]
ruby = ["tree-sitter-ruby==0.23.1"]
php = ["tree-sitter-php==0.24.1"]
dart = ["tree-sitter-dart==0.1.0"]
# The Streamable HTTP transport of the MCP server (`wingbox mcp --http`) is its own distribution,
# packages/wingbox-http: this package holds no listening code. Same version as wingbox (REQ-HTTP-021).
http = ["wingbox-http==0.13.0"]
all = [
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-java==0.23.5",
    "tree-sitter-go==0.25.0",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-php==0.24.1",
    "tree-sitter-dart==0.1.0",
]

[project.urls]
Homepage = "https://wingbox.dev"
Repository = "https://github.com/aileron-tech/wingbox"
Changelog = "https://github.com/aileron-tech/wingbox/blob/main/CHANGELOG.md"
Issues = "https://github.com/aileron-tech/wingbox/issues"
Documentation = "https://github.com/aileron-tech/wingbox#readme"
Benchmarks = "https://wingbox.dev/benchmarks"
"Release notes" = "https://github.com/aileron-tech/wingbox/releases"

[project.scripts]
wingbox = "wingbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wingbox"]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "wingbox/_scripts"
"SKILL.md" = "wingbox/_skill/SKILL.md"
"references" = "wingbox/_skill/references"

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/SKILL.md", "/references", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]
