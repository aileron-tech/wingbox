[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wingbox"
version = "0.12.2"
description = "A map of your codebase for AI coding agents: what a change breaks, where a symbol is used, how the architecture is layered. Local, no model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aileron Technologies" }]
keywords = [
    "code-graph",
    "blast-radius",
    "impact-analysis",
    "dependency-graph",
    "code-search",
    "static-analysis",
    "tree-sitter",
    "ai-coding-agents",
    "claude-code",
    "codex",
    "offline",
    "local-first",
    "air-gapped",
    "graphify",
    "graphify-alternative",
    "knowledge-graph",
    "code-knowledge-graph",
    "codebase-map",
    "mcp",
    "mcp-server",
    "claude-code-plugin",
    "cursor",
    "monorepo",
    "architecture",
    "find-usages",
    "refactoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-rust==0.24.2",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
# The parsers of these languages are installed on demand: `wingbox add csharp` puts the pinned wheel
# into ~/.wingbox/parsers, and without it the files of the language are skipped. An extra installs the
# same parser with the package instead (pip install "wingbox[csharp]", "wingbox[all]"). The pins equal
# those of the language adapters and of src/wingbox/assets/parsers.json (tools/update_parsers.py).
csharp = ["tree-sitter-c-sharp==0.23.5"]
java = ["tree-sitter-java==0.23.5"]
go = ["tree-sitter-go==0.25.0"]
ruby = ["tree-sitter-ruby==0.23.1"]
php = ["tree-sitter-php==0.24.1"]
dart = ["tree-sitter-dart==0.1.0"]
all = [
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-java==0.23.5",
    "tree-sitter-go==0.25.0",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-php==0.24.1",
    "tree-sitter-dart==0.1.0",
]

[project.urls]
Homepage = "https://wingbox.dev"
Repository = "https://github.com/aileron-tech/wingbox"
Changelog = "https://github.com/aileron-tech/wingbox/blob/main/CHANGELOG.md"
Issues = "https://github.com/aileron-tech/wingbox/issues"
Documentation = "https://github.com/aileron-tech/wingbox#readme"
Benchmarks = "https://wingbox.dev/benchmarks"
"Release notes" = "https://github.com/aileron-tech/wingbox/releases"

[project.scripts]
wingbox = "wingbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wingbox"]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "wingbox/_scripts"
"SKILL.md" = "wingbox/_skill/SKILL.md"
"references" = "wingbox/_skill/references"

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/SKILL.md", "/references", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]
