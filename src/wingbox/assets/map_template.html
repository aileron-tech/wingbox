<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__WINGBOX_TITLE__ - Wingbox map</title>
<style>
:root {
  --bg0: #070b16; --bg1: #0b1730; --navy: #0b1730; --pill: #0f2242;
  --blue: #38bdf8; --sky: #7dd3fc; --ice: #bae6fd;
  --amber: #fbbf24; --amber2: #f59e0b; --core: #fde68a;
  --green: #34d399; --mint: #6ee7b7; --red: #f87171;
  --text: #f8fafc; --sub: #e2e8f0; --muted: #94a3b8;
  --mono: ui-monospace, "SF Mono", "GeistMono NF", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--sans); color: var(--sub); overflow: hidden;
  background:
    radial-gradient(circle at 1.2px 1.2px, rgba(147,197,253,0.10) 1.2px, transparent 1.6px) 0 0 / 32px 32px,
    radial-gradient(ellipse 55% 60% at 62% 50%, rgba(29,78,216,0.34), rgba(29,78,216,0) 70%),
    linear-gradient(135deg, var(--bg0), var(--bg1));
  background-color: var(--bg0);
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#scene.over { cursor: pointer; }
#head { position: fixed; left: 28px; top: 22px; right: 392px; pointer-events: none; }
#head > * { pointer-events: auto; }
.kicker { font-family: var(--mono); font-size: 12px; letter-spacing: 4px; color: var(--sky); opacity: .85; text-transform: uppercase; }
h1 { margin: 8px 0 2px; font-size: 44px; line-height: 1.05; font-weight: 700; letter-spacing: -1px; color: var(--text); overflow-wrap: anywhere; }
.lede { font-size: 16px; color: var(--sub); margin: 0 0 14px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.group { display: inline-flex; border: 1.2px solid rgba(56,189,248,.55); border-radius: 20px; background: var(--pill); overflow: hidden; }
.pill, .group button, #search {
  font-family: var(--mono); font-size: 13px; color: var(--ice); background: var(--pill);
  border: 1.2px solid rgba(56,189,248,.55); border-radius: 20px; padding: 6px 14px; cursor: pointer; line-height: 1.2;
}
.group button { border: 0; border-radius: 0; background: transparent; padding: 6px 12px; }
.group button + button { border-left: 1px solid rgba(56,189,248,.28); }
.group .cap { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 7px 4px 6px 12px; }
.pill:hover, .group button:hover { color: var(--text); background: rgba(56,189,248,.16); }
.pill[aria-pressed="true"], .group button[aria-pressed="true"] { background: rgba(56,189,248,.26); color: var(--text); }
.pill.warn { border-color: rgba(248,113,113,.7); color: #fecaca; }
.pill.warn[aria-pressed="true"] { background: rgba(248,113,113,.24); color: #fff; }
.pill:disabled { opacity: .45; cursor: default; }
.pill:focus-visible, .group button:focus-visible, #search:focus-visible, .row:focus-visible { outline: 2px solid var(--core); outline-offset: 2px; }
#searchbox { position: relative; }
#search { width: 220px; cursor: text; }
#search::placeholder { color: var(--muted); }
#hits { position: absolute; left: 0; top: 36px; width: 380px; max-width: 80vw; background: rgba(11,23,48,.97); border: 1px solid rgba(56,189,248,.45); border-radius: 12px; padding: 4px; display: none; z-index: 5; }
#hits.on { display: block; }
#panel {
  position: fixed; right: 16px; top: 16px; bottom: 16px; width: 360px; overflow: auto;
  background: rgba(9,18,38,.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(125,211,252,.28); border-radius: 16px; padding: 16px 16px 10px;
  scrollbar-width: thin; scrollbar-color: rgba(125,211,252,.3) transparent;
}
#panel h2 { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--sky); margin: 18px 0 8px; font-weight: 500; }
#panel h2:first-child { margin-top: 0; }
.card { border: 1px solid rgba(251,191,36,.55); background: rgba(251,191,36,.07); border-radius: 12px; padding: 12px; margin-bottom: 6px; }
.card .name { font-family: var(--mono); font-size: 13px; color: var(--core); overflow-wrap: anywhere; }
.card .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.stats { display: flex; gap: 14px; margin: 10px 0 8px; }
.stat b { display: block; font-size: 22px; color: var(--text); font-weight: 650; line-height: 1.1; }
.stat span { font-size: 11px; color: var(--muted); }
.cmd { display: flex; gap: 6px; align-items: stretch; margin: 8px 0 2px; }
.cmd code { flex: 1; font-family: var(--mono); font-size: 12px; color: var(--ice); background: rgba(7,11,22,.75); border: 1px solid rgba(56,189,248,.3); border-radius: 8px; padding: 7px 9px; overflow-wrap: anywhere; }
.cmd button { font-family: var(--mono); font-size: 12px; color: var(--ice); background: var(--pill); border: 1px solid rgba(56,189,248,.5); border-radius: 8px; padding: 0 10px; cursor: pointer; }
.sub { font-family: var(--mono); font-size: 11px; color: var(--amber); margin: 10px 0 4px; }
.sub.dep { color: var(--ice); }
.row { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 7px; padding: 4px 6px; color: var(--sub); font-family: var(--mono); font-size: 12px; cursor: pointer; }
.row:hover { background: rgba(56,189,248,.14); color: var(--text); }
.row .f { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.row .f bdi { direction: ltr; unicode-bidi: isolate; }
.row .n { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.row .sw { flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.8px solid var(--sky); align-self: center; }
.row.on { background: rgba(56,189,248,.2); color: var(--text); }
.more { font-size: 11px; color: var(--muted); padding: 2px 6px 4px; }
.close { float: right; font-family: var(--mono); font-size: 12px; color: var(--muted); background: transparent; border: 0; cursor: pointer; padding: 0 2px; }
.close:hover { color: var(--text); }
table.mx { border-collapse: separate; border-spacing: 2px; font-family: var(--mono); font-size: 11px; width: 100%; }
table.mx th { color: var(--muted); font-weight: 400; text-align: right; padding: 2px 4px; white-space: nowrap; }
table.mx thead th { text-align: center; }
table.mx td { text-align: center; padding: 3px 2px; border-radius: 4px; background: rgba(56,189,248,.07); color: var(--sub); font-variant-numeric: tabular-nums; min-width: 26px; }
table.mx td.z { color: rgba(148,163,184,.35); background: transparent; }
table.mx td.same { background: rgba(148,163,184,.10); color: var(--muted); }
table.mx td.bad { background: rgba(248,113,113,.26); color: #fff; outline: 1px solid rgba(248,113,113,.7); }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 4px 0; }
.note a, .foot a { color: var(--sky); text-decoration: none; }
.note a:hover, .foot a:hover { text-decoration: underline; }
.rule { font-family: var(--sans); font-size: 11px; color: #fca5a5; padding: 0 6px 5px 23px; }
.foot { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 18px; padding-top: 10px; border-top: 1px solid rgba(125,211,252,.16); line-height: 1.6; }
#hint { position: fixed; left: 28px; bottom: 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); pointer-events: none; }
#tip { position: fixed; display: none; pointer-events: none; z-index: 6; max-width: 420px; font-family: var(--mono); font-size: 12px; color: var(--text); background: rgba(7,11,22,.94); border: 1px solid rgba(125,211,252,.45); border-radius: 8px; padding: 7px 9px; }
#tip small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
noscript { position: fixed; inset: 40% 10% auto; text-align: center; color: var(--sub); }
@media (max-width: 860px) {
  body { overflow: hidden; }
  #head { right: 16px; left: 16px; top: 12px; }
  h1 { font-size: 26px; } .lede { font-size: 13px; margin-bottom: 8px; }
  #panel { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; height: 38vh; }
  #hint { display: none; }
  #search { width: 130px; }
  .pills { gap: 6px; margin-bottom: 0; }
  .pill, .group button, #search { font-size: 11px; padding: 5px 9px; }
  .group .cap { display: none; }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive map of the code graph"></canvas>
<div id="head">
  <div class="kicker">Wingbox / code graph</div>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <div class="pills" id="pills"></div>
</div>
<aside id="panel" aria-live="polite"></aside>
<div id="hint">click: blast radius &nbsp;/&nbsp; double-click: open or close a package &nbsp;/&nbsp; drag: move, or turn the layers &nbsp;/&nbsp; scroll: zoom &nbsp;/&nbsp; esc: clear</div>
<div id="tip" role="tooltip"></div>
<noscript>This map needs JavaScript. The same facts are in REPORT.md next to this file.</noscript>
<script id="wingbox-data" type="application/json">__WINGBOX_DATA__</script>
<!--

-->
<script>__WINGBOX_D3__</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("wingbox-data").textContent);
const MODS = DATA.modules, EDGES = DATA.edges, LAYERS = DATA.layers, N = MODS.length;
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const C = {
  blue: "#38bdf8", sky: "#7dd3fc", ice: "#bae6fd", navy: "#0b1730", amber: "#fbbf24", amber2: "#f59e0b",
  core: "#fde68a", green: "#34d399", red: "#f87171", text: "#f8fafc", muted: "#94a3b8",
};
const LAYER_COLOR = {
  ui: "#a78bfa", api: "#60a5fa", service: "#f472b6", domain: "#34d399", infra: "#fb923c",
  shared: "#a3e635", config: "#cbd5e1", test: "#7c8aa0", other: "#7c8aa0",
};
const PACKAGE_COLORS = ["#60a5fa", "#fb923c", "#34d399", "#f472b6", "#a3e635", "#a78bfa"];
const OTHER_COLOR = "#7c8aa0";
const MONO = 'ui-monospace, "SF Mono", "GeistMono NF", Menlo, Consolas, monospace';
const MAX_PACKAGES = 140, OPEN_ALL_BELOW = 800, EXPAND_ALL_LIMIT = 3500, STEP = 520;

// ---------- small helpers ----------
const fmt = (n) => n.toLocaleString("en-US");
const plural = (n, word) => `${fmt(n)} ${word}${n === 1 ? "" : "s"}`;
const dependencies = (n) => `${fmt(n)} ${n === 1 ? "dependency" : "dependencies"}`;
const share = (part) => (N ? Math.round((100 * part) / N) : 0) + "%";
const base = (path) => path.slice(path.lastIndexOf("/") + 1);
const dirOf = (path) => { const i = path.lastIndexOf("/"); return i < 0 ? "" : path.slice(0, i); };
const rgba = (hex, a) => {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${a})`;
};
const tints = new Map();
const tint = (hex) => {
  let out = tints.get(hex);
  if (!out) {
    const v = parseInt(hex.slice(1), 16), mix = (c, base) => Math.round(base + (c - base) * 0.2);
    out = `rgb(${mix(v >> 16, 11)},${mix((v >> 8) & 255, 23)},${mix(v & 255, 48)})`;
    tints.set(hex, out);
  }
  return out;
};
function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const kid of kids.flat()) if (kid) node.append(kid);
  return node;
}

// ---------- module graph ----------
const outOf = Array.from({ length: N }, () => []);
const intoOf = Array.from({ length: N }, () => []);
for (const [s, t] of EDGES) { outOf[s].push(t); intoOf[t].push(s); }
const layerName = (i) => LAYERS[MODS[i].layer];

// packages: directories cut at the deepest level that keeps the map readable
const dirs = MODS.map((m) => dirOf(m.file));
const cut = (dir, depth) => (dir ? dir.split("/").slice(0, depth).join("/") : ".");
let maxDepth = 1;
for (const d of dirs) if (d) maxDepth = Math.max(maxDepth, d.split("/").length);
let pkgDepth = 1;
for (let d = 1; d <= maxDepth; d++) {
  if (new Set(dirs.map((x) => cut(x, d))).size <= MAX_PACKAGES) pkgDepth = d; else break;
}
const pkgOf = dirs.map((d) => cut(d, pkgDepth));
const packages = new Map();
MODS.forEach((m, i) => {
  let p = packages.get(pkgOf[i]);
  if (!p) { p = { key: pkgOf[i], mods: [], layers: {} }; packages.set(p.key, p); }
  p.mods.push(i);
  p.layers[m.layer] = (p.layers[m.layer] || 0) + 1;
});
for (const p of packages.values()) {
  p.layer = +Object.entries(p.layers).sort((a, b) => b[1] - a[1] || a[0] - b[0])[0][0];
}

// colour groups for the "packages" colouring: top-level folders, the tail folds into "other"
let colorDepth = 1;
for (let d = 1; d <= maxDepth; d++) { colorDepth = d; if (new Set(dirs.map((x) => cut(x, d))).size >= 3) break; }
const groupOf = dirs.map((d) => cut(d, colorDepth));
const groupCount = new Map();
for (const g of groupOf) groupCount.set(g, (groupCount.get(g) || 0) + 1);
const groupRank = [...groupCount.entries()].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
const groupColor = new Map(groupRank.map(([g], i) => [g, i < PACKAGE_COLORS.length ? PACKAGE_COLORS[i] : OTHER_COLOR]));

// ---------- state ----------
const state = {
  layout: "graph", color: "wire", depth: Math.min(4, Math.max(1, DATA.depth || 2)),
  yaw: -0.55, pitch: 0.5, spin: true,
  expanded: new Set(), violations: false, hover: null, focus: null, sel: null,
};
if (N <= OPEN_ALL_BELOW) for (const key of packages.keys()) state.expanded.add(key);
let interacted = false;

// ---------- visible graph: a node is a module, or a closed package ----------
let nodes = [], links = [], nodeByKey = new Map(), bands = new Map(), bandWidth = 0;
const rep = new Array(N);
const moduleRadius = (i) => Math.min(16, 3.4 + Math.sqrt(MODS[i].in) * 1.5);
const packageRadius = (count) => Math.min(46, 7 + Math.sqrt(count) * 2.4);

function rebuild() {
  const old = nodeByKey;
  nodeByKey = new Map(); nodes = [];
  for (const p of packages.values()) {
    if (state.expanded.has(p.key)) {
      const origin = old.get("p:" + p.key);
      for (const i of p.mods) {
        const key = "m" + i;
        let n = old.get(key);
        if (!n) {
          n = { key, type: "m", i, pkg: p.key };
          if (origin) { n.x = origin.x + (Math.random() - 0.5) * 30; n.y = origin.y + (Math.random() - 0.5) * 30; }
        }
        n.r = moduleRadius(i); n.layer = MODS[i].layer; n.label = base(MODS[i].file);
        nodes.push(n); nodeByKey.set(key, n); rep[i] = n;
      }
    } else {
      const key = "p:" + p.key;
      let n = old.get(key);
      if (!n) {
        n = { key, type: "p", pkg: p.key };
        let sx = 0, sy = 0, c = 0;
        for (const i of p.mods) { const m = old.get("m" + i); if (m && m.x !== undefined) { sx += m.x; sy += m.y; c++; } }
        if (c) { n.x = sx / c; n.y = sy / c; }
      }
      n.r = packageRadius(p.mods.length); n.layer = p.layer; n.count = p.mods.length;
      n.label = p.key === "." ? "(root)" : p.key.split("/").slice(-2).join("/");
      nodes.push(n); nodeByKey.set(key, n);
      for (const i of p.mods) rep[i] = n;
    }
  }
  const merged = new Map();
  for (const [s, t] of EDGES) {
    const a = rep[s], b = rep[t];
    if (a === b) continue;
    const key = a.key + ">" + b.key;
    let l = merged.get(key);
    if (!l) { l = { key, source: a, target: b, w: 0, bad: 0 }; merged.set(key, l); }
    l.w++;
  }
  for (const [s, t] of DATA.violations) {
    const l = merged.get(rep[s].key + ">" + rep[t].key);
    if (l) l.bad++;
  }
  links = [...merged.values()];
  countDegrees();
  if (state.sel && !nodeByKey.has(state.sel.key)) dropSelection();
  if (state.sel) projectSelection();
  layoutBands();
  sim.nodes(nodes);
  linkForce.links(links);
  applyForces();
  settle(0.9);
}

// ---------- layers layout: one band per architecture layer ----------
const stage = { width: 900, depth: 600, gap: 160, focal: 3000, radius: 500, top: 0 };
const layerTotals = new Map(DATA.layerCounts);
function layoutBands() {
  bands = new Map();
  const area = new Map(), count = new Map();
  for (const n of nodes) {
    area.set(n.layer, (area.get(n.layer) || 0) + Math.PI * (n.r + 7) * (n.r + 7) * 2.6);
    count.set(n.layer, (count.get(n.layer) || 0) + (n.count || 1));
  }
  let most = 0;
  for (const value of area.values()) most = Math.max(most, value);
  stage.width = Math.max(460, Math.min(2600, Math.sqrt(most * 1.5)));
  stage.depth = stage.width / 1.5;
  stage.gap = Math.max(96, Math.min(240, stage.width * 0.19));
  const order = [...area.keys()].sort((x, y) => x - y);
  const middle = (order.length - 1) / 2;
  const span = stage.depth + 60;          // planes sit side by side in simulation space
  order.forEach((layer, i) => {
    const centre = (i - middle) * span;
    bands.set(layer, {
      y0: centre - stage.depth / 2, y1: centre + stage.depth / 2, mid: centre,
      h: (middle - i) * stage.gap, name: LAYERS[layer], count: layerTotals.get(LAYERS[layer]) || count.get(layer),
    });
  });
  bandWidth = stage.width;
  stage.top = middle * stage.gap;
  stage.radius = Math.hypot(stage.width / 2, stage.depth / 2);
  stage.focal = Math.hypot(stage.radius, stage.top) * 3.4;
}

// ---------- forces ----------
const linkForce = d3.forceLink().id((d) => d.key);
const sim = d3.forceSimulation().velocityDecay(0.36).on("tick", () => { if (autoFit) fit(0); requestDraw(); });
sim.force("link", linkForce);

function clusterForce(alpha) {
  const sum = new Map();
  for (const n of nodes) {
    if (n.type !== "m") continue;
    let c = sum.get(n.pkg);
    if (!c) { c = { x: 0, y: 0, n: 0 }; sum.set(n.pkg, c); }
    c.x += n.x; c.y += n.y; c.n++;
  }
  for (const n of nodes) {
    if (n.type !== "m") continue;
    const c = sum.get(n.pkg);
    n.vx += (c.x / c.n - n.x) * 0.09 * alpha;
    n.vy += (c.y / c.n - n.y) * 0.09 * alpha;
  }
}
function bandForce() {
  const half = bandWidth / 2;
  for (const n of nodes) {
    const b = bands.get(n.layer);
    if (!b) continue;
    const lo = b.y0 + n.r + 8, hi = b.y1 - n.r - 8;
    if (n.y < lo) { n.y = lo; n.vy = 0; } else if (n.y > hi) { n.y = hi; n.vy = 0; }
    const edge = half - n.r - 8;
    if (n.x < -edge) { n.x = -edge; n.vx = Math.max(0, n.vx); }
    else if (n.x > edge) { n.x = edge; n.vx = Math.min(0, n.vx); }
  }
}
function blastForce(alpha) {
  const sel = state.sel;
  if (!sel) return;
  const root = nodeByKey.get(sel.key);
  if (!root) return;
  const outer = sel.rings[sel.rings.length - 1] + 70;
  const pull = Math.min(1, alpha * 3.2);
  for (const n of nodes) {
    if (n === root) continue;
    const aim = sel.aim.get(n.key);
    if (aim) {
      n.vx += (root.x + aim[0] - n.x) * 0.42 * pull;
      n.vy += (root.y + aim[1] - n.y) * 0.42 * pull;
      continue;
    }
    const dx = n.x - root.x, dy = n.y - root.y;
    const dist = Math.hypot(dx, dy) || 1;
    if (dist < outer) {
      const k = ((outer - dist) / dist) * 0.3 * pull;
      n.vx += dx * k; n.vy += dy * k;
    }
  }
}
// In the layers view the layout is brought to rest before it is drawn, so nothing
// moves on screen; the graph view keeps its live settling.
function settle(alpha) {
  if (state.layout !== "layers") { sim.alpha(alpha).restart(); return; }
  sim.stop();
  sim.alpha(alpha);
  for (let t = 0; t < 300 && sim.alpha() > 0.02; t++) sim.tick();
  sim.alpha(0);
  if (autoFit) fit(0);
  requestDraw();
}
function applyForces() {
  const layers = state.layout === "layers";
  const radial = !layers && !!state.sel;
  const big = nodes.length > 1500;
  sim.alphaDecay(big ? 0.045 : 0.026);
  linkForce
    .distance((l) => 24 + l.source.r + l.target.r)
    .strength((l) => {
      const natural = 1 / Math.min(degree.get(l.source.key) || 1, degree.get(l.target.key) || 1);
      return natural * (layers ? 0.12 : radial ? 0.012 : 1);
    });
  sim.force("charge", d3.forceManyBody().strength((n) => -(layers ? 26 : 46) - n.r * n.r * (layers ? 0.35 : 0.9)).distanceMax(900).theta(0.92));
  sim.force("collide", d3.forceCollide((n) => n.r + (layers ? 5 : 4)).strength(0.85));
  sim.force("x", d3.forceX(0).strength(layers ? 0.012 : 0.034));
  sim.force("y", layers

  const head = el("tr", {}, el("th", { text: "from \\ to" }), present.map((l) => el("th", { title: LAYERS[l], text: short(LAYERS[l]) })));
  const body = present.map((from) => el("tr", {}, el("th", { text: LAYERS[from] }), present.map((to) => {
    const count = counts.get(from + ">" + to) || 0;
    const reason = denied.get(LAYERS[from] + ">" + LAYERS[to]);
    const cls = count === 0 ? "z" : reason ? "bad" : from === to ? "same" : "";
    return el("td", { class: cls, title: `${LAYERS[from]} -> ${LAYERS[to]}: ${dependencies(count)}${reason && count ? " / rule broken: " + reason : ""}`, text: count ? fmt(count) : "·" });
  })));

}
function renderPanel(toTop) {
  const panel = document.getElementById("panel");
  const top = MODS.map((m, i) => i).filter((i) => MODS[i].in > 0 && layerName(i) !== "test")
    .sort((a, b) => MODS[b].in - MODS[a].in || MODS[b].reach - MODS[a].reach || (MODS[a].file < MODS[b].file ? -1 : 1)).slice(0, 12);
  const parts = [];
  if (state.sel) parts.push(el("h2", { text: "Blast radius" }), selectionCard());
  parts.push(el("h2", { text: "Most depended-on (tests left out)" }),
    top.length ? top.map((i) => fileRow(i, fmt(MODS[i].in))) : el("div", { class: "note", text: "No module depends on another one." }));
  parts.push(el("h2", { text: state.color === "packages" ? "Packages" : "Architecture layers" }), legend());
  const table = matrix();
  if (table) parts.push(el("h2", { text: "Dependencies between layers" }), table,
    el("div", { class: "note", text: `Rows depend on columns. A red cell is a pair of layers that a rule of a part's style forbids; a dependency in it is a violation when both ends are in that part, it imports code, not only types, and both layers are set by rules. The rules place ${share(DATA.placed[0] + DATA.placed[1])} of the modules: ${fmt(DATA.placed[0])} by folder, ${fmt(DATA.placed[1])} by a guess from the role of the file.` }));
  parts.push(el("h2", { text: "Boundary violations" }));
  if (DATA.violations.length) {
    for (const [s, t, rule] of DATA.violations.slice(0, 30)) {
      parts.push(el("button", { class: "row", type: "button", title: `${MODS[s].file} -> ${MODS[t].file}`, onclick: () => { state.violations = true; renderPills(); selectModule(t); } },
        el("span", { class: "sw", style: `border-color:${C.red}` }),
        el("span", { class: "f" }, el("bdi", { text: `${base(MODS[s].file)} -> ${base(MODS[t].file)}` }))),
        el("div", { class: "rule", text: DATA.ruleReasons[rule] }));
    }
    if (DATA.violations.length > 30) parts.push(el("div", { class: "more", text: `+ ${fmt(DATA.violations.length - 30)} more: wingbox boundaries all` }));
  } else parts.push(el("div", { class: "note", text: `None between layers that are set by folders (${share(DATA.placed[0])} of the modules).` }));
  if (DATA.typeOnly) parts.push(el("div", { class: "note", text: `${plural(DATA.typeOnly, "import")} of types only ${DATA.typeOnly === 1 ? "crosses" : "cross"} a boundary and ${DATA.typeOnly === 1 ? "is" : "are"} not counted: wingbox boundaries all` }));
  if (DATA.candidates) parts.push(el("div", { class: "note", text: `${plural(DATA.candidates, "more candidate")} rest on a guessed layer and are not drawn: wingbox boundaries all` }));
  parts.push(el("div", { class: "foot" },
    el("div", {}, "table view: ", el("a", { href: "REPORT.md", text: "REPORT.md" })),
    el("div", { text: `generated ${DATA.generated} by wingbox ${DATA.version}` }),
    el("div", {}, el("a", { href: "https://github.com/aileron-tech/wingbox", rel: "noopener", text: "github.com/aileron-tech/wingbox" })),
    el("div", { text: "static parsing: run-time wiring is not on the map" })));
  const scroll = panel.scrollTop;
  panel.replaceChildren(...parts.flat());
  panel.scrollTop = toTop ? 0 : scroll;
}

// ---------- link state: map.html#select=src/file.ts&view=layers ----------
function writeHash() {
  const parts = [];
  if (state.sel) {
    const n = nodeByKey.get(state.sel.key);
    if (n && n.type === "m") parts.push("select=" + encodeURIComponent(MODS[n.i].file));
  } else if (interacted) parts.push("select=none");
  if (state.layout !== "graph") parts.push("view=" + state.layout);
  if (state.layout === "layers" && !state.spin) parts.push("yaw=" + state.yaw.toFixed(2), "pitch=" + state.pitch.toFixed(2));
  if (state.color !== "wire") parts.push("colour=" + state.color);
  if (state.depth !== DATA.depth) parts.push("hops=" + state.depth);
  if (state.violations) parts.push("violations=1");
  try { history.replaceState(null, "", parts.length ? "#" + parts.join("&") : location.pathname + location.search); } catch (error) { /* file:// may refuse; the map still works */ }
}
function readHash() {
  const out = {};
  for (const part of location.hash.slice(1).split("&")) {
    const i = part.indexOf("=");
    if (i > 0) out[part.slice(0, i)] = decodeURIComponent(part.slice(i + 1));
  }
  return out;
}

// ---------- start ----------
document.getElementById("title").textContent = DATA.project;
document.getElementById("lede").textContent =
  `${plural(N, "module")}, ${dependencies(EDGES.length)}, ${plural(DATA.violations.length, "boundary violation")}`;
const opts = readHash();
if (opts.view === "layers") state.layout = "layers";
if (opts.yaw !== undefined && isFinite(+opts.yaw)) { state.yaw = +opts.yaw; state.spin = false; }
if (opts.pitch !== undefined && isFinite(+opts.pitch)) state.pitch = Math.max(0.1, Math.min(1.35, +opts.pitch));
if (["layers", "packages"].includes(opts.colour)) state.color = opts.colour;
if (+opts.hops >= 1 && +opts.hops <= 4) state.depth = +opts.hops;
if (opts.violations === "1" && DATA.violations.length) state.violations = true;
resize();
rebuild();
renderPills(); renderPanel(true);
const wanted = opts.select && opts.select !== "none" ? MODS.findIndex((m) => m.file === opts.select) : -1;
const first = wanted >= 0 ? wanted : opts.select === "none" ? -1 : DATA.start;
if (first >= 0) {
  setTimeout(() => { if (!interacted || wanted >= 0) selectModule(first); }, REDUCED ? 0 : Math.min(2600, 900 + nodes.length * 2));
}
})();
